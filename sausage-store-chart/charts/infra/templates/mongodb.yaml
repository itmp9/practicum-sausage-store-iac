apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          envFrom:
            - secretRef:
                name: {{ .Values.mongodb.existingRootSecret }}
            - secretRef:
                name: {{ .Values.mongodb.existingAppSecret }}
          env:
            - name: MONGO_REPORTS_DATABASE
              value: {{ .Values.mongodb.database | quote }}
          ports:
            - containerPort: {{ .Values.mongodb.containerPort }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mongodb.containerPort }}
            periodSeconds: 5
          resources:
            requests: {memory: 192Mi, cpu: 50m}
            limits: {memory: 512Mi, cpu: 250m}
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            - name: mongodb-init
              mountPath: /docker-entrypoint-initdb.d/20-reports.js
              subPath: 20-reports.js
              readOnly: true
      volumes:
        - name: mongodb-init
          configMap:
            name: mongodb-init
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  ports:
    - port: {{ .Values.mongodb.containerPort }}
      targetPort: {{ .Values.mongodb.containerPort }}
  selector:
    app: mongodb
  clusterIP: None
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
data:
  20-reports.js: |
    const database = process.env.MONGO_REPORTS_DATABASE;
    db.getSiblingDB(database).createUser({
      user: process.env.MONGO_REPORTS_USERNAME,
      pwd: process.env.MONGO_REPORTS_PASSWORD,
      roles: [{ role: "readWrite", db: database }]
    });
