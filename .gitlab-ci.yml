workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  tags: [docker]

variables:
  OPERATION:
    value: terraform
    options: [terraform, ansible, k8s]
    description: "What to run"
  TF_ACTION:
    value: plan
    options: [plan, apply, destroy]
    description: "Terraform action"
  TF_STATE_NAME: sausage-store
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.11.4"
  CHART_VERSION: "1.0.2"

stages:
  - checks
  - plan
  - apply
  - terratest
  - ansible
  - destroy
  - build
  - package

.terraform:
  image:
    name: hashicorp/terraform:1.11.4
    entrypoint: [""]
  before_script:
    - . ci/terraform-env.sh
    - cd infra
    - terraform init -input=false -lockfile=readonly

checkov:
  stage: checks
  image:
    name: bridgecrew/checkov:3.2.471
    entrypoint: [""]
  script:
    - cd infra
    - checkov --config-file .checkov.yml --directory .
  allow_failure: true
  rules:
    - if: '$OPERATION == "terraform" && $TF_ACTION != "destroy"'

plan:
  extends: .terraform
  stage: plan
  script:
    - terraform validate
    - terraform plan -lock-timeout=3m -out=deployment.tfplan
  artifacts:
    expire_in: 1 hour
    paths: [infra/deployment.tfplan]
  rules:
    - if: '$OPERATION == "terraform" && ($TF_ACTION == "plan" || $TF_ACTION == "apply")'

apply:
  extends: .terraform
  stage: apply
  needs: [plan]
  resource_group: sausage-store-infra
  script:
    - terraform apply -lock-timeout=3m deployment.tfplan
  rules:
    - if: '$OPERATION == "terraform" && $TF_ACTION == "apply"'

terratest:
  stage: terratest
  image: golang:1.25.4-alpine
  needs:
    - job: apply
      artifacts: false
  before_script:
    - apk add --no-cache curl unzip
    - sh ci/install-terraform.sh
    - . ci/terraform-env.sh
    - cd infra
    - terraform init -input=false -lockfile=readonly
  script:
    - cd test
    - go test -mod=readonly -v -count=1 -timeout=8m ./...
  allow_failure: false
  rules:
    - if: '$OPERATION == "terraform" && $TF_ACTION == "apply"'

ansible-deploy:
  extends: .terraform
  stage: ansible
  resource_group: sausage-store-infra
  script:
    - apk add --no-cache ansible openssh-client curl
    - export VAULT_VM_ADDRESS="$(terraform output -raw vm_dev_address)"
    - test -n "$VAULT_VM_ADDRESS"
    - install -m 700 -d "$HOME/.ssh"
    - install -m 600 "${SSH_KNOWN_HOSTS:?}" "$HOME/.ssh/known_hosts"
    - install -m 600 "${SSH_PRIVATE_KEY:?}" "$HOME/.ssh/training_key"
    - cd ../ansible
    - ansible-galaxy collection install -r requirements.yml
    - ANSIBLE_CONFIG="$PWD/ansible.cfg" ansible-playbook -i inventory/vm.yml --private-key "$HOME/.ssh/training_key" vault-playbook.yml
    - curl --noproxy '*' --fail --silent --show-error --output /dev/null --max-time 10 "http://$VAULT_VM_ADDRESS:8200/v1/sys/health"
  rules:
    - if: '$OPERATION == "ansible"'

destroy:
  extends: .terraform
  stage: destroy
  resource_group: sausage-store-infra
  script:
    - terraform destroy -auto-approve -lock-timeout=3m
  rules:
    - if: '$OPERATION == "terraform" && $TF_ACTION == "destroy"'
      when: manual
      allow_failure: false

build-and-push-images:
  stage: build
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.28.0-debug@sha256:eaa584c90089955adc0c48773c4e4670b55383eb13372bbf56a9cf7238bde69f
    entrypoint: [""]
  parallel:
    matrix:
      - COMPONENT: [backend, frontend, backend-report]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      (
        umask 077
        auth="$(printf '%s:%s' "${DOCKER_USER:?}" "${DOCKER_PASSWORD:?}" | base64 | tr -d '\n')"
        printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}\n' "$auth" > /kaniko/.docker/config.json
      )
  script:
    - |
      umask 022
      /kaniko/executor \
        --context "$CI_PROJECT_DIR/$COMPONENT" \
        --dockerfile "$CI_PROJECT_DIR/$COMPONENT/Dockerfile" \
        --build-arg "VERSION=$CI_COMMIT_SHA" \
        --destination "docker.io/${DOCKER_NAMESPACE:-$DOCKER_USER}/sausage-$COMPONENT:$CI_COMMIT_SHA"
  rules:
    - if: '$OPERATION == "k8s"'

package-helm-chart:
  stage: package
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  needs: [build-and-push-images]
  before_script:
    - apk add --no-cache curl
  script:
    - sh ci/publish-chart.sh
  artifacts:
    expire_in: 7 days
    paths: [dist/*.tgz]
  rules:
    - if: '$OPERATION == "k8s"'
